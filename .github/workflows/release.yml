name: Release

# Push a tag to cut a release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# The tag name is passed straight through as make's VERSION, so the archives
# land at magpie-v1.0.0-<os>-<arch>.{tar.gz,zip} — exactly the names npm/
# install.js builds its download URL from. Keep npm/package.json's version in
# step with the tag, or `npm install -g @chamberz40/magpie` will 404.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # web/embed.go embeds `all:dist`, so the web package does not compile —
      # and `go test ./...` does not even build — until the UI is built once.
      # Install from web/pnpm-lock.yaml rather than letting `make web` fall
      # back to `npm install`, so the shipped UI comes from the same dependency
      # tree CI tests against.
      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Run tests
        run: go test ./...

      - name: Build release archives
        run: make release-all VERSION="${GITHUB_REF_NAME}"

      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check checksums.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt
